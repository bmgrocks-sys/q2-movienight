<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Office Movie Night Match!</title>
    <style>
        /* Modern, Clean & Warm Color Palette */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f9f6f0; /* Soft warm cream */
            color: #2c2c2c; /* Deep charcoal instead of harsh black */
            text-align: center; 
            padding: 50px 20px; 
            margin: 0;
        }
        
        .container { 
            max-width: 460px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); /* Subtler, elegant shadow */
            border: 1px solid #eae5da;
        }
        
        h1 { 
            color: #7d7565; /* Sophisticated muted bronze/gold */
            font-size: 0.95rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .movie-title { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin: 10px 0 30px 0; 
            color: #1a1a1a; 
            line-height: 1.2;
        }
        
        /* Elegant Poster Presentation */
        .poster-container { 
            width: 100%; 
            max-width: 260px; 
            margin: 0 auto 35px auto; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 12px 30px rgba(125, 117, 101, 0.2); 
            display: none; 
            transition: transform 0.2s ease;
        }
        .poster-container:hover {
            transform: scale(1.02);
        }
        .poster-img { 
            width: 100%; 
            height: auto; 
            display: block; 
        }
        
        /* Styled Action Elements */
        .btn-container { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            align-items: center; 
            width: 100%; 
        }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 1rem; 
            text-align: center; 
            box-sizing: border-box; 
            transition: all 0.2s ease; 
            border: none; 
        }
        
        .btn:active { 
            transform: scale(0.98); 
        }
        
        /* Primary Action: Warm Gold Accent */
        .btn-vote { 
            background-color: #d4af37; /* Warm soft gold */
            color: #ffffff; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .btn-vote:hover { 
            background-color: #c19e2e; 
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }
        
        /* Secondary Action: Minimal Muted Button */
        .btn-custom { 
            background-color: #f2efe9; 
            color: #6e6658; 
        }
        .btn-custom:hover { 
            background-color: #e6e1d6; 
            color: #4a443a; 
        }
        
        /* Success Message Area */
        #status-message { 
            display: none; 
            margin-top: 15px; 
            font-size: 1.1rem; 
            color: #438a5e; /* Elegant sage green success text */
            font-weight: 600; 
            line-height: 1.5;
            background-color: #edf7f1;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #d4ebd9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Your Recommended Match</h1>
    <div id="winner-display" class="movie-title">Calculating...</div>
    
    <div id="poster-frame" class="poster-container">
        <img id="movie-poster" class="poster-img" src="" alt="Movie Poster">
    </div>
    
    <div id="action-zone">
        <div class="btn-container">
            <button id="vote-recommendation-btn" class="btn btn-vote">🍿 Vote for this Movie</button>
            <a id="manual-override-btn" href="#" class="btn btn-custom">✏️ Choose my own movie instead</a>
        </div>
    </div>
    
    <div id="status-message">Your vote has been locked in automatically! Your choice has been added to the master leaderboard.</div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    
    // 1. Capture the email variable passed from Typeform
    const userEmail = urlParams.get('email') || "anonymous@company.com";
    
    const movies = {
        "The Hunger Games": parseInt(urlParams.get('hunger')) || 0,
        "The Wizard of Oz": parseInt(urlParams.get('wizard')) || 0,
        "Coraline": parseInt(urlParams.get('coraline')) || 0,
        "The Truman Show": parseInt(urlParams.get('truman')) || 0,
        "Mamma Mia": parseInt(urlParams.get('mamma')) || 0,
        "Split": parseInt(urlParams.get('split')) || 0,
        "10 Things I Hate About You": parseInt(urlParams.get('tenthings')) || 0,
        "Gattaca": parseInt(urlParams.get('gattaca')) || 0,
        "The Replacements": parseInt(urlParams.get('replacements')) || 0,
        "Spiderman: Into the Spiderverse": parseInt(urlParams.get('spiderverse')) || 0,
        "La La Land": parseInt(urlParams.get('lalaland')) || 0
    };

    const posterImages = {
        "The Hunger Games": "hunger-games.png",
        "The Wizard of Oz": "wizard-of-oz.png",
        "Coraline": "coraline.png",
        "The Truman Show": "truman-show.jpg",
        "Mamma Mia": "mamma-mia.png",
        "Split": "split.png",
        "10 Things I Hate About You": "10-things-i-hate-about-you.png",
        "Gattaca": "gattaca.png",
        "The Replacements": "replacements.png",
        "Spiderman: Into the Spiderverse": "spiderman-into-the-spiderverse.png",
        "La La Land": "la-la-land.png"
    };

    let quizWinner = "";
    let highestScore = -999;
    for (const [movie, score] of Object.entries(movies)) {
        if (score > highestScore) {
            highestScore = score;
            quizWinner = movie;
        }
    }
    
    document.getElementById('winner-display').innerText = quizWinner;

    if (posterImages[quizWinner]) {
        const posterFrame = document.getElementById('poster-frame');
        const posterImg = document.getElementById('movie-poster');
        posterImg.src = posterImages[quizWinner];
        posterFrame.style.display = 'block';
    }

    // === EDIT THIS SECTION WITH YOUR NEW GOOGLE FORM DETAILS ===
    const googleFormSubmitURL = "https://docs.google.com/forms/d/e/1FAIpQLSflTNsEGlRxkh69vvcWvMsL_1sbzjlO8ZGVOcq_0CcBvCvP0Q/formResponse"; // MUST end in /formResponse
    const emailEntryId = "entry.189373097"; // Your Email Short Answer field ID
    const movieEntryId = "entry.1259170426"; // Your Movie Multiple Choice field ID
    // ==============================================================

    // BUTTON 1 LOGIC: Silent multi-field background form submission
    document.getElementById('vote-recommendation-btn').addEventListener('click', function() {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = googleFormSubmitURL;
        form.target = 'hidden_iframe';

        // Pack Field 1: The User's Email Address
        const emailInput = document.createElement('input');
        emailInput.type = 'hidden';
        emailInput.name = emailEntryId;
        emailInput.value = userEmail;
        form.appendChild(emailInput);

        // Pack Field 2: The Calculated Movie Recommendation Choice
        const movieInput = document.createElement('input');
        movieInput.type = 'hidden';
        movieInput.name = movieEntryId;
        movieInput.value = quizWinner;
        form.appendChild(movieInput);

        // Submit data package securely
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        document.getElementById('action-zone').style.display = 'none';
        document.getElementById('status-message').style.display = 'block';
    });

    // BUTTON 2 LOGIC: Manual override redirect (Passes email forward so they don't have to re-type it manually!)
    const normalFormViewURL = `${googleFormSubmitURL.replace('/formResponse', '/viewform')}?usp=pp_url&${emailEntryId}=${encodeURIComponent(userEmail)}`;
    document.getElementById('manual-override-btn').href = normalFormViewURL;
</script>
