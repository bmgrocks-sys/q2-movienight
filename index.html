<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Office Movie Night Match!</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #141414; color: white; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: 0 auto; background: #222; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #E50914; font-size: 2.2rem; margin-bottom: 10px; }
        .movie-title { font-size: 2.5rem; font-weight: bold; margin: 25px 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .btn-container { display: flex; flex-direction: column; gap: 15px; margin-top: 35px; align-items: center; }
        .btn { display: block; width: 80%; padding: 14px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; text-align: center; box-sizing: border-box; transition: transform 0.1s, background 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-vote { background-color: #E50914; color: white; border: none; cursor: pointer; }
        .btn-vote:hover { background-color: #b80710; }
        .btn-custom { background-color: #444; color: #ccc; }
        .btn-custom:hover { background-color: #555; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>Your Recommended Match Is:</h1>
    <div id="winner-display" class="movie-title">Calculating...</div>
    
    <div class="btn-container">
        <a id="vote-recommendation-btn" href="#" class="btn btn-vote">🍿 Vote for this Movie</a>
        
        <a id="manual-override-btn" href="#" class="btn btn-custom">✏️ Choose my own movie instead</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    
    const movies = {
        "The Hunger Games": parseInt(urlParams.get('hunger')) || 0,
        "The Wizard of Oz": parseInt(urlParams.get('wizard')) || 0,
        "Coraline": parseInt(urlParams.get('coraline')) || 0,
        "The Truman Show": parseInt(urlParams.get('truman')) || 0,
        "Mamma Mia": parseInt(urlParams.get('mamma')) || 0,
        "Split": parseInt(urlParams.get('split')) || 0,
        "10 Things I Hate About You": parseInt(urlParams.get('tenthings')) || 0,
        "Gattaca": parseInt(urlParams.get('gattaca')) || 0,
        "The Replacements": parseInt(urlParams.get('replacements')) || 0,
        "Spiderman: Into the Spiderverse": parseInt(urlParams.get('spiderverse')) || 0,
        "La La Land": parseInt(urlParams.get('lalaland')) || 0
    };

    let quizWinner = "";
    let highestScore = -999;
    for (const [movie, score] of Object.entries(movies)) {
        if (score > highestScore) {
            highestScore = score;
            quizWinner = movie;
        }
    }
    document.getElementById('winner-display').innerText = quizWinner;

    // === EDIT THIS SECTION WITH YOUR GOOGLE FORM LINK & ITEM ID ===
    const googleFormBaseURL = "https://docs.google.com/forms/d/e/1FAIpQLSdzApSjZbb__8NMeRF-f2P19bctZfdb2XiyDnC1haMfpb5luQ/viewform"; // Base form link
    const movieEntryId = "entry.454048091";  // Your Movie Dropdown Entry ID
    // ==============================================================

    // Configures Button 1 to auto-fill the choice field
    const automaticVoteURL = `${googleFormBaseURL}?usp=pp_url&${movieEntryId}=${encodeURIComponent(quizWinner)}`;
    document.getElementById('vote-recommendation-btn').href = automaticVoteURL;

    // Configures Button 2 to just open the standard form link directly
    document.getElementById('manual-override-btn').href = googleFormBaseURL;
</script>

</body>
</html>
